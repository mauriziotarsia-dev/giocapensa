<style>
:root{
  color-scheme: light;
  --page:#E6E8EB; --ink:#14171B; --ink-2:#5A616B; --surface:#FFFFFF; --line:#CBD0D7;
  --tray:#16181B; --tray-lip:#343840; --floor:#202328; --stud:#2B2F36; --stud-hi:#3E434D; --dash:#9299A3;
  --focus:#0A66FF;
  --font:"Overpass","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0F1114; --ink:#EDEFF2; --ink-2:#9AA1AB; --surface:#1B1E23; --line:#2F343C;
    --tray:#050607; --tray-lip:#3D424C; --floor:#191C20; --stud:#252930; --stud-hi:#373C46; --dash:#7F8690;
    --focus:#6AA5FF;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0F1114; --ink:#EDEFF2; --ink-2:#9AA1AB; --surface:#1B1E23; --line:#2F343C;
  --tray:#050607; --tray-lip:#3D424C; --floor:#191C20; --stud:#252930; --stud-hi:#373C46; --dash:#7F8690;
  --focus:#6AA5FF;
}

/* the three looks: piece colours, board materials, colour of the round controls */
[data-skin="cars"]{ --c-r:#E8452E; --c-y:#F3B61F; --c-b:#2D5BDA; --c-g:#27AE86; --c-h:#A30F2D; --mark:#F3B61F; --sign:#1557C0 }
[data-skin="medieval"]{
  --c-r:#C9402E; --c-y:#E2AA2C; --c-b:#3F63BD; --c-g:#3F9460; --c-h:#9E1030; --mark:#F2C24B; --sign:#7A4A21;
  --tray:#5C5244; --tray-lip:#3E372D; --merlon:#9C8F79; --floor:#4E453A; --slab-a:#8C7F6A; --slab-b:#978A73; --slab-c:#817560; --slab-hi:#B3A68E;
}
[data-skin="harbor"]{
  --c-r:#E6503A; --c-y:#F5C02C; --c-b:#4B7BEA; --c-g:#35B98D; --c-h:#A30F2D; --mark:#FFD34D; --sign:#0E6E83;
  --tray:#6E4D2F; --tray-lip:#47301B; --plank:#7D5936; --floor:#12506A; --wave:#5FB3CC; --cellmark:#1A6180;
}
[data-skin="pixel"]{
  --c-r:#F2452E; --c-y:#FFC21A; --c-b:#3B6CF0; --c-g:#2FBF5B; --c-h:#B5122F; --mark:#FFE14D; --sign:#3457D5;
  --tray:#B26A33; --tray-lip:#4E270C; --floor:#58B646; --grass-a:#66C552; --grass-b:#58B646; --grass-d:#3E9435;
}
[data-skin="pastel"]{
  --c-r:#F2665A; --c-y:#FFD95A; --c-b:#6FAEF5; --c-g:#7CCB78; --c-h:#D6274A; --mark:#FF8A3D; --sign:#3D8BD4;
  --tray:#8ED1F2; --tray-lip:#3E6B8A; --floor:#A6D970; --meadow:#B9E68A; --line-ink:#4A3B52;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  background:var(--page); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.35;
  overflow-x:hidden; -webkit-text-size-adjust:100%; touch-action:manipulation;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
}
input{-webkit-user-select:text; user-select:text; font-family:inherit; color:inherit}
button{font-family:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
button:focus-visible,.veh:focus-visible,input:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
[hidden]{display:none !important}

.app{
  max-width:540px; min-height:100vh; min-height:100dvh; margin:0 auto;
  padding:max(10px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));
  display:flex; flex-direction:column; gap:10px;
  overflow-x:hidden; overflow-x:clip; /* the freed piece drives off the board: never let it widen the page */
}

/* top bar */
.bar{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px}
.pill{
  justify-self:start; display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 15px 0 12px;
  border-radius:20px; border:1.5px solid var(--line); background:var(--surface); font-weight:600; font-size:.9375rem;
}
.pill svg,.iconbtn svg{width:20px; height:20px}
.where{display:flex; align-items:center; gap:10px}
.badge{
  min-width:40px; height:40px; padding:2px 6px 0; border-radius:20px; display:grid; place-items:center;
  background:var(--tier); color:var(--tier-ink); font-weight:900; font-size:1.0625rem; font-variant-numeric:tabular-nums;
}
.wtxt{display:flex; flex-direction:column; line-height:1.15}
.wtxt strong{font-weight:800; font-size:1rem}
.wtxt span{color:var(--ink-2); font-size:.8125rem}
.iconbtn{
  justify-self:end; width:40px; height:40px; padding:0; border-radius:50%; border:1.5px solid var(--line);
  background:var(--surface); display:grid; place-items:center; flex:none;
}

/* counters */
.stats{display:flex; justify-content:center; gap:22px; margin:2px 0 0; color:var(--ink-2); font-size:.9375rem}
.stats b{color:var(--ink); font-weight:800; font-variant-numeric:tabular-nums; margin-left:3px}

/* board */
.stage{
  --frame:clamp(10px,3.4vw,16px);
  --grid:max(168px, min(calc(100vw - 50px - 2 * var(--frame)), 468px, calc(100vh - 300px)));
  --grid:max(168px, min(calc(100vw - 50px - 2 * var(--frame)), 468px, calc(100dvh - 300px)));
  display:flex; justify-content:center; padding:2px 0;
; touch-action:none}
.tray{
  position:relative; padding:var(--frame); background:var(--tray); border-radius:calc(var(--frame) * 1.9);
  box-shadow:inset 0 0 0 1.5px var(--tray-lip), 0 14px 26px -16px rgba(0,0,0,.6);
}
.grid{
  --cell:calc(var(--grid) / 6);
  position:relative; width:var(--grid); height:var(--grid); background:var(--floor); border-radius:7px; touch-action:none;
}
.floor{position:absolute; inset:0; width:100%; height:100%; display:block; border-radius:inherit}
.stud{fill:var(--stud)}
.stud-hi{fill:none; stroke:var(--stud-hi); stroke-width:2.5; stroke-linecap:round}
.dash{fill:var(--dash); opacity:.8}
.exit{
  position:absolute; left:calc(100% - 1px); top:calc(var(--cell) * 2); width:calc(var(--frame) + 12px); height:var(--cell);
  background:var(--floor); border-radius:0 9px 9px 0; display:grid; place-items:center; color:var(--mark);
  box-shadow:0 -1.5px 0 var(--tray-lip), 0 1.5px 0 var(--tray-lip), 1.5px 0 0 var(--tray-lip);
}
.exit svg{width:74%; height:auto; display:block}
.exit.flash svg{animation:flash .5s ease-in-out 2}
@keyframes flash{50%{opacity:.25}}

/* medieval: crenellated stone wall, two gate towers */
[data-skin="medieval"] .tray{border-radius:calc(var(--frame) * .9)}
[data-skin="medieval"] .tray::before{
  content:""; position:absolute; inset:2.5px; border-radius:calc(var(--frame) * .7); pointer-events:none;
  border:calc(var(--frame) * .5) dashed var(--merlon); opacity:.9;
}
[data-skin="medieval"] .grid{border-radius:3px}
[data-skin="medieval"] .exit{border-radius:0}
[data-skin="medieval"] .exit::before,[data-skin="medieval"] .exit::after{
  content:""; position:absolute; right:-3px; width:calc(var(--frame) * 1.25); height:calc(var(--frame) * 1.25); border-radius:50%;
  background:var(--merlon); box-shadow:inset 0 0 0 3px var(--tray-lip), 0 2px 0 rgba(0,0,0,.35);
}
[data-skin="medieval"] .exit::before{top:calc(var(--frame) * -.95)}
[data-skin="medieval"] .exit::after{bottom:calc(var(--frame) * -.95)}
/* harbour: plank quay, two channel buoys */
[data-skin="harbor"] .tray{background:repeating-linear-gradient(90deg, var(--plank) 0 13px, var(--tray) 13px 15px)}
[data-skin="harbor"] .exit::before,[data-skin="harbor"] .exit::after{
  content:""; position:absolute; right:3px; width:11px; height:11px; border-radius:50%; box-shadow:0 0 0 2px rgba(255,255,255,.85), 0 2px 3px rgba(0,0,0,.4);
}
[data-skin="harbor"] .exit::before{top:-5px; background:#E6503A}
[data-skin="harbor"] .exit::after{bottom:-5px; background:#35B98D}
/* pixel: a wall of square blocks, hard edges everywhere */
[data-skin="pixel"] .tray{
  border-radius:3px;
  background:
    repeating-linear-gradient(90deg, rgba(62,28,6,.8) 0 2px, rgba(255,255,255,.26) 2px 4px, transparent 4px var(--frame)),
    repeating-linear-gradient(0deg, rgba(62,28,6,.8) 0 2px, rgba(255,255,255,.26) 2px 4px, transparent 4px var(--frame)),
    var(--tray);
}
[data-skin="pixel"] .grid,[data-skin="pixel"] .exit{border-radius:0}
[data-skin="pixel"] .veh svg,[data-skin="pixel"] .floor,[data-skin="pixel"] .pv svg{shape-rendering:crispEdges}
[data-skin="pixel"] .ghost::after{border-radius:0}
/* pastel: a child's drawing, thick plum outlines, the sun in the corner */
[data-skin="pastel"] .tray{border-radius:calc(var(--frame) * 2.3); box-shadow:inset 0 0 0 3px var(--tray-lip), 0 14px 26px -16px rgba(0,0,0,.45)}
[data-skin="pastel"] .tray::after{
  content:""; position:absolute; top:calc(var(--frame) * -.55); left:calc(var(--frame) * -.55); width:calc(var(--frame) * 2.5); height:calc(var(--frame) * 2.5);
  border-radius:50%; background:#FFD95A; box-shadow:0 0 0 3px var(--line-ink); pointer-events:none;
}
[data-skin="pastel"] .grid{border-radius:calc(var(--frame) * 1.1); box-shadow:0 0 0 3px var(--line-ink)}
[data-skin="pastel"] .exit{box-shadow:0 -3px 0 var(--line-ink), 0 3px 0 var(--line-ink), 3px 0 0 var(--line-ink); border-radius:0 12px 12px 0}

.veh,.ghost{
  position:absolute; left:0; top:0;
  width:calc(var(--cell) * var(--w)); height:calc(var(--cell) * var(--h));
  transform:translate3d(calc(var(--cell) * var(--x)), calc(var(--cell) * var(--y)), 0);
}
.veh{
  z-index:2; cursor:grab; touch-action:none; border-radius:calc(var(--cell) * .26);
  transition:transform .16s cubic-bezier(.2,.9,.25,1);
}
.veh svg{width:100%; height:100%; display:block; overflow:visible; pointer-events:none; transition:transform .12s ease-out}
.veh.dragging{transition:none; cursor:grabbing; z-index:5}
.veh.dragging svg{transform:scale(1.035)}
.veh.leaving{transition:transform .6s cubic-bezier(.55,0,.85,.5), opacity .18s linear .42s; opacity:0; z-index:6}
.veh.enter svg{animation:drop .34s cubic-bezier(.2,.9,.25,1) both; animation-delay:calc(var(--i) * 24ms)}
@keyframes drop{from{opacity:0; transform:scale(.8)}}
.veh.hint{z-index:3}
.veh.hint svg{animation:pulse .95s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07); filter:brightness(1.18)}}
.veh.nope.h svg{animation:nopeX .26s ease-in-out}
.veh.nope.v svg{animation:nopeY .26s ease-in-out}
@keyframes nopeX{25%{transform:translateX(-3.5%)}75%{transform:translateX(3.5%)}}
@keyframes nopeY{25%{transform:translateY(-3.5%)}75%{transform:translateY(3.5%)}}
.ghost{z-index:4; pointer-events:none}
.ghost::after{
  content:""; position:absolute; inset:calc(var(--cell) * .09); border-radius:calc(var(--cell) * .22);
  border:2.5px dashed rgba(255,255,255,.92); background:rgba(255,255,255,.1);
}

/* message line */
.status{margin:0; min-height:2.7em; display:grid; place-items:center; text-align:center; color:var(--ink-2); font-size:.9375rem; padding:0 8px; text-wrap:balance}

/* controls, shaped like round signs */
.controls{display:flex; justify-content:center; gap:clamp(16px,8vw,40px); margin-top:auto; padding-bottom:2px}
.sign{position:relative; display:flex; flex-direction:column; align-items:center; gap:7px; min-width:76px; padding:2px; border:0; background:none; font-weight:600; font-size:.8125rem}
.ring{display:none; position:absolute; top:-1px; left:50%; width:64px; height:64px; margin-left:-32px; transform:rotate(-90deg); pointer-events:none}
.ring circle{fill:none; stroke-width:4.5; stroke-linecap:round}
.ring .bg{stroke:var(--ink-2); opacity:.28}
.ring .fill{stroke:var(--sign); transition:stroke-dashoffset .3s linear}
.sign.waiting .ring{display:block}
.disc{
  width:58px; height:58px; border-radius:50%; display:grid; place-items:center; background:var(--sign); color:#fff;
  box-shadow:inset 0 0 0 2.5px var(--sign), inset 0 0 0 4.5px #fff; transition:transform .1s ease-out;
}
.disc svg{width:27px; height:27px}
.sign:active .disc{transform:scale(.93)}
.sign:disabled{cursor:default; color:var(--ink-2)}
.sign:disabled .disc{opacity:.38; transform:none}

/* result sheet */
.result{
  position:fixed; z-index:20; left:0; right:0; bottom:0; max-width:540px; margin:0 auto; background:var(--surface);
  border-radius:24px 24px 0 0; padding:22px 20px max(20px,env(safe-area-inset-bottom)); text-align:center;
  box-shadow:0 -16px 44px -18px rgba(0,0,0,.5), 0 0 0 1.5px var(--line);
  transform:translateY(105%); transition:transform .34s cubic-bezier(.2,.9,.25,1);
}
.result.show{transform:none}
.result h2{margin:0; font-weight:900; font-size:1.875rem; letter-spacing:-.01em; line-height:1.1}
.result .perfect{display:inline-flex; align-items:center; gap:6px; margin:10px 0 0; padding:5px 12px 3px 9px; border-radius:16px; background:#F3B61F; color:#2A1E00; font-weight:800; font-size:.875rem}
.result .perfect svg{width:16px; height:16px; margin-top:-3px}
.result p{margin:10px auto 0; max-width:34ch; color:var(--ink-2); text-wrap:balance}
.actions{display:flex; gap:10px; margin-top:18px}
.btn{flex:1; height:50px; padding:2px 14px 0; border-radius:25px; border:1.5px solid var(--line); background:transparent; font-weight:800; font-size:1rem}
.btn.primary{flex:1.6; background:var(--ink); border-color:var(--ink); color:var(--page)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45}

/* full-height sheets: levels and menu */
dialog{color:var(--ink); font-family:var(--font)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.sheet{
  width:100%; max-width:540px; height:100%; max-height:100vh; max-height:100dvh; margin:0 auto; padding:0; border:0;
  background:var(--page); overflow:hidden;
}

.sheet-head{
  display:flex; align-items:flex-start; justify-content:space-between; gap:12px;

}
.sheet-head h2{margin:0; font-weight:900; font-size:1.5rem; letter-spacing:-.01em; line-height:1.15}

.cells{display:grid; grid-template-columns:repeat(8,1fr); gap:7px}

<script id="opzioni">
/* Settings shared by the home screen and all six games, kept in localStorage under one key.
   Games read them at every use, so a change on the home screen reaches a game as soon as it is opened. */
window.OPZ = (function () {
  'use strict';
  var KEY = 'giocapensa.opzioni';
  var DEF = { musica: true, suoni: true, voce: true, lingua: 'it', aiuto: 'attesa' };
  var val = {}, k;
  for (k in DEF) val[k] = DEF[k];
  try {
    var raw = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (raw && typeof raw === 'object') {
      ['musica', 'suoni', 'voce'].forEach(function (n) { if (typeof raw[n] === 'boolean') val[n] = raw[n]; });
      if (raw.lingua === 'it' || raw.lingua === 'en') val.lingua = raw.lingua;
      if (['subito', 'attesa', 'mai'].indexOf(raw.aiuto) >= 0) val.aiuto = raw.aiuto;
    } else if (localStorage.getItem('giocapensa.musica') === '0') val.musica = false;      // the old music-only switch
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(val)); } catch (e) {} }
  return {
    get: function (n) { return val[n]; },
    set: function (n, v) { if (!(n in DEF)) return; val[n] = v; save(); try { window.dispatchEvent(new CustomEvent('opz', { detail: { nome: n, valore: v } })); } catch (e) {} },
    all: function () { var o = {}, q; for (q in val) o[q] = val[q]; return o; }
  };
})();

</script>
<script id="tocco">
/* On iPhone two quick taps zoom the page in, and the app ends up cut off at the edges.
   The playing areas are driven by pointer events, not by clicks, so a second quick tap there
   can be stopped without losing anything. Buttons and texts outside keep working as usual. */
(function () {
  'use strict';
  var AREA = '.stage, .scene, .tray, .traywrap, .board', last = 0;
  function inArea(el) { return !!(el && el.closest && el.closest(AREA)); }
  document.addEventListener('touchend', function (e) {
    var t = Date.now(), quick = t - last < 450; last = t;
    if (quick && inArea(e.target) && e.cancelable) e.preventDefault();
  }, { passive: false });
  ['gesturestart', 'gesturechange'].forEach(function (ev) {                    // and no pinch zoom over the board
    document.addEventListener(ev, function (e) { if (inArea(e.target) && e.cancelable) e.preventDefault(); }, { passive: false });
  });
  document.addEventListener('dblclick', function (e) { if (inArea(e.target) && e.cancelable) e.preventDefault(); }, { passive: false });
})();

</script>
<script id="sound">
/* Shared sound engine. Every effect is synthesised on the spot with Web Audio (no audio files): small "instruments"
   (marimba, bell, pop, thud, whoosh, boing, bubbles, pad) played through a soft compressor and a little room reverb.
   On iPhone Web Audio follows the ring/silent switch. Use: SFX.play('place', { i: 3 }) or SFX.play('drop', { note: 659.25 }). */
window.SFX = (function () {
  'use strict';
  var AC = window.AudioContext || window.webkitAudioContext, ctx = null, dry = null, wet = null, noiseBuf = null, forced = null;
  var PENTA = [1, 9 / 8, 5 / 4, 3 / 2, 5 / 3], MAJOR = [1, 9 / 8, 5 / 4, 4 / 3, 3 / 2, 5 / 3, 15 / 8];
  function penta(i) { i = Math.max(0, i | 0); return 523.25 * PENTA[i % 5] * Math.pow(2, Math.floor(i / 5)); }
  function major(i) { i = Math.max(0, i | 0); return 523.25 * MAJOR[i % 7] * Math.pow(2, Math.floor(i / 7)); }
  function build(c) {
    ctx = c;
    var comp = ctx.createDynamicsCompressor(); comp.threshold.value = -14; comp.knee.value = 20; comp.ratio.value = 3.5; comp.attack.value = 0.003; comp.release.value = 0.2; comp.connect(ctx.destination);
    dry = ctx.createGain(); dry.gain.value = 0.9; dry.connect(comp);
    var n = Math.floor(ctx.sampleRate * 1.3), ir = ctx.createBuffer(2, n, ctx.sampleRate), ch, i, d;              // a small bright room, made of decaying noise
    for (ch = 0; ch < 2; ch++) { d = ir.getChannelData(ch); for (i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3.2) * (i < 400 ? i / 400 : 1); }
    var conv = ctx.createConvolver(); conv.buffer = ir; wet = ctx.createGain(); wet.gain.value = 0.5; wet.connect(conv); conv.connect(comp);
    n = Math.floor(ctx.sampleRate * 0.7); noiseBuf = ctx.createBuffer(1, n, ctx.sampleRate); d = noiseBuf.getChannelData(0); for (i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;

    else if (act === 'load' && store.saves[id]) { snapshot(); activate(id, 'Partita «' + store.saves[id].name + '» caricata.'); closeDlg(menu); }
    else if (act === 'delete' && store.saves[id]) { pendingDelete = id; $('confirmTitle').textContent = 'Eliminare «' + store.saves[id].name + '»?'; $('confirmText').textContent = 'I livelli risolti e i record di questa partita vengono cancellati.'; openDlg(confirmDlg); }
    else if (act === 'skin') { var k = b.getAttribute('data-skin-name'); if (SKINS[k] && k !== S().skin) { S().skin = k; touched = true; commitSave(true); paintBoard(); setStatus(''); renderMenu(); sfx('move'); } }
    else if (act === 'sound') { var v = !(store.sound && soundOn()); store.sound = v; if (window.OPZ) OPZ.set('suoni', v); saveLocal(); renderMenu(); if (v) { wakeAudio(); sfx('move'); } }
    else if (act === 'hintmode') { var m = b.getAttribute('data-mode'); if (HINT_MODES.indexOf(m) >= 0 && m !== hintMode()) { store.hintMode = m; if (window.OPZ) OPZ.set('aiuto', m); saveLocal(); gateReset(gate.need); renderMenu(); } }
  });

  var nameMode = '';
  function nameTaken(n, exceptId) { n = n.toLowerCase(); return liveSaves().some(function (s) { return s.id !== exceptId && s.name.toLowerCase() === n; }); }
  function suggestName() { for (var i = 1; i < 99; i++) if (!nameTaken('Partita ' + i)) return 'Partita ' + i; return 'Partita'; }
  function syncStart() { var n = clampInt($('startInput').value, 1, RAW.length); $('startInput').value = n; return n; }
  function openName(mode) {
    nameMode = mode;
    $('nameTitle').textContent = mode === 'rename' ? 'Rinomina la partita' : mode === 'new' ? 'Nuova partita' : 'Salva con nome';
    $('nameIntro').textContent = mode === 'saveas' ? 'Crea una copia della partita in corso, con i livelli risolti e il tabellone com\'è adesso, e continua da lì.' : mode === 'new' ? 'Riparte da zero: la partita in corso resta salvata.' : '';
    $('nameIntro').hidden = mode === 'rename'; $('startField').hidden = mode !== 'new';
    $('nameInput').value = mode === 'rename' ? S().name : suggestName(); $('nameErr').textContent = ''; $('startInput').value = 1;
    $('btnNameYes').textContent = mode === 'new' ? 'Inizia' : 'Salva';
    openDlg(nameDlg);
    try { $('nameInput').focus(); $('nameInput').select(); } catch (e) {}
  }
  function confirmName() {
    var n = $('nameInput').value.replace(/\s+/g, ' ').trim().slice(0, 24), cur = S();
    if (!n) { $('nameErr').textContent = 'Scrivi un nome per la partita.'; return; }
    if (nameTaken(n, nameMode === 'rename' ? cur.id : '')) { $('nameErr').textContent = 'Esiste già una partita con questo nome.'; return; }
    touched = true;
    if (nameMode === 'rename') { cur.name = n; commitSave(true); setStatus(''); }
    else {
      snapshot(); cur.updated = now(); cloudNow(cur.id);
      var s = blankSave(n, 0, cur.skin);
      if (nameMode === 'saveas') { s.level = cur.level; s.best = JSON.parse(JSON.stringify(cur.best)); s.board = cur.board ? JSON.parse(JSON.stringify(cur.board)) : null; }
      else s.level = syncStart() - 1;
      s.updated = now() + 1; store.saves[s.id] = s; store.active = s.id; saveLocal(); cloudNow(s.id);
      if (nameMode === 'saveas') setStatus('Partita salvata come «' + n + '».'); else applyActive('Partita «' + n + '» creata.');
    }
    closeDlg(nameDlg);
    if (nameMode === 'new') closeDlg(menu); else renderMenu();
  }
  $('btnNameYes').addEventListener('click', confirmName);
  $('btnNameNo').addEventListener('click', function () { closeDlg(nameDlg); });
  $('nameInput').addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); confirmName(); } });
  $('nameInput').addEventListener('input', function () { $('nameErr').textContent = ''; });
  $('startMinus').addEventListener('click', function () { $('startInput').value = syncStart() - 1; syncStart(); });
  $('startPlus').addEventListener('click', function () { $('startInput').value = syncStart() + 1; syncStart(); });
  $('startInput').addEventListener('change', syncStart);
  $('tierPick').innerHTML = TIERS.map(function (t, i) { return i * PER_TIER < RAW.length ? '<button type="button" data-start="' + (i * PER_TIER + 1) + '" style="--tier:' + t.color + ';--tier-ink:' + t.ink + '">' + t.name + '</button>' : ''; }).join('');
  $('tierPick').addEventListener('click', function (e) { var b = e.target.closest ? e.target.closest('[data-start]') : null; if (b) $('startInput').value = b.getAttribute('data-start'); });
  $('btnConfirmNo').addEventListener('click', function () { closeDlg(confirmDlg); });
  $('btnConfirmYes').addEventListener('click', function () {
    var s = store.saves[pendingDelete];
    if (s && s.id !== store.active) { store.saves[s.id] = { id: s.id, name: s.name, created: s.created, updated: now(), level: 0, skin: 'cars', best: {}, board: null, deleted: true }; saveLocal(); cloudNow(s.id); }
    pendingDelete = ''; closeDlg(confirmDlg); renderMenu();
  });

  /* ---------- wiring ---------- */
  grid.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  $('btnUndo').addEventListener('click', undo);
  $('btnReset').addEventListener('click', restart);
  $('btnHint').addEventListener('click', hint);
  $('btnLevels').addEventListener('click', openSheet);
  $('btnMenu').addEventListener('click', openMenu);
  $('btnCloseSheet').addEventListener('click', function () { closeDlg(sheet); });
  $('btnCloseMenu').addEventListener('click', function () { closeDlg(menu); });
  $('btnAgain').addEventListener('click', function () { touched = true; loadLevel(level, false); });
  $('btnNextLevel').addEventListener('click', function () { touched = true; if (level >= RAW.length - 1) { hideResult(); openSheet(); } else loadLevel(level + 1, false); });

  loadLocal(); buildSheet(); applyActive(''); saveLocal(); cloudInit();
})();
</script>

<script>if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });</script>
