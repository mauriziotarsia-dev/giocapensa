name: Candidatura in evidenza
on:
  workflow_dispatch:
    inputs:
      davvero:
        description: "Invia davvero (senza la spunta è solo una prova che non cambia niente)"
        type: boolean
        default: false
  push:
    # Claude: a push on candida-prova only says what it would send; a push on candida-asc sends the nomination to Apple
    branches: [candida-prova, candida-asc]
jobs:
  candida:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Strumenti
        run: python -m pip install --quiet "pyjwt[crypto]>=2.8,<3"
      - name: Candida
        # nomination of the new version for an App Store feature, with the texts and the release date of scheda/testi.json
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
          DAVVERO: ${{ github.ref_name == 'candida-asc' || inputs.davvero == true }}
        run: |
          if [ "$DAVVERO" = true ]; then
            python scheda/carica.py scheda --candida --davvero
          else
            python scheda/carica.py scheda --candida
          fi
