name: App per iPhone
on:
  workflow_dispatch:
    inputs:
      versione:
        description: "Versione dell'app: 1.0 la prima volta, poi 1.1, 1.2..."
        required: true
        default: "1.0"
  push:
    # Claude's dry runs: a push to this branch builds and signs everything for the App Store, but sends nothing to Apple
    branches: [prova-iphone]
jobs:
  carica:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      PROVA: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
      - name: Controlla i segreti
        # a missing or mistyped secret stops here with a plain message, instead of a long build failing later
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          P8: ${{ secrets.APPSTORE_P8 }}
        run: |
          ok=1
          # spaces and line breaks picked up when pasting on the phone do not count
          TEAM="${TEAM//[[:space:]]/}"; KEY_ID="${KEY_ID//[[:space:]]/}"; ISSUER="${ISSUER//[[:space:]]/}"
          for n in TEAM:APPLE_TEAM_ID:B1 KEY_ID:APPSTORE_KEY_ID:B7 ISSUER:APPSTORE_ISSUER_ID:B7 P8:APPSTORE_P8:B8; do
            IFS=: read -r v s step <<< "$n"
            [ -n "${!v}" ] || { echo "::error title=Segreti::Manca il segreto $s: aggiungilo come al passo C1 (il valore viene dal passo $step)."; ok=0; }
          done
          hint() {   # what a wrong value looks like, without ever printing it ($2: the length it should have)
            local x="$1"
            if [[ "$x" == *PRIVATE*KEY* ]]; then echo " Contiene il testo della chiave: va in APPSTORE_P8.";
            elif [ "$2" = 10 ] && [[ "$x" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}- ]]; then echo " Contiene trattini come l'Issuer ID: forse i due codici sono scambiati.";
            elif [ "$2" = 36 ] && [[ "$x" =~ ^[A-Z0-9]{10}$ ]]; then echo " Sembra un codice di 10 caratteri come l'ID chiave: forse i due codici sono scambiati.";
            elif [ "$2" = 10 ] && [[ "$x" =~ [a-z] ]]; then echo " Contiene lettere minuscole: il codice è tutto maiuscolo.";
            else echo " Ha ${#x} caratteri invece di $2."; fi
          }
          [ -z "$TEAM" ] || [[ "$TEAM" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error title=Segreti::APPLE_TEAM_ID deve essere di 10 caratteri, lettere maiuscole e numeri (passo B1).$(hint "$TEAM" 10)"; ok=0; }
          [ -z "$KEY_ID" ] || [[ "$KEY_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error title=Segreti::APPSTORE_KEY_ID deve essere di 10 caratteri, lettere maiuscole e numeri (passo B7).$(hint "$KEY_ID" 10)"; ok=0; }
          [ -z "$ISSUER" ] || [[ "$ISSUER" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]] || { echo "::error title=Segreti::APPSTORE_ISSUER_ID deve avere la forma xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx (passo B7).$(hint "$ISSUER" 36)"; ok=0; }
          [ -z "$P8" ] || { [[ "$P8" == *"BEGIN PRIVATE KEY"* ]] && [[ "$P8" == *"END PRIVATE KEY"* ]]; } || { echo "::error title=Segreti::APPSTORE_P8 deve contenere tutto il testo della chiave, comprese le righe BEGIN e END (passo B8)."; ok=0; }
          [ "$ok" = 1 ]
      - name: Xcode
        # the runner's default Xcode if it is 26.2 or later (needed by the age check, DeclaredAgeRange); otherwise the
        # oldest installed release that is recent enough. Never a beta or a release candidate: the App Store refuses them.
        run: |
          python3 - <<'PY'
          import glob, os, re, subprocess, sys
          NEED = (26, 2)
          def ver(s): return tuple(int(x) for x in s.split('.'))
          def current(): return subprocess.run(['xcodebuild', '-version'], capture_output=True, text=True).stdout.split()
          cur = current()[1]
          if ver(cur) < NEED:
              ok = []
              for app in glob.glob('/Applications/Xcode_*.app'):
                  m = re.fullmatch(r'Xcode_(\d+(?:\.\d+)*)\.app', os.path.basename(app))   # betas and release candidates have longer names
                  if m and ver(m.group(1)) >= NEED:
                      ok.append((ver(m.group(1)), app))
              if not ok:
                  print("::error title=Xcode::Il Mac di GitHub ha Xcode %s: serve Xcode 26.2 o successivo. Riprova tra qualche giorno." % cur)
                  sys.exit(1)
              subprocess.run(['sudo', 'xcode-select', '-s', min(ok)[1]], check=True)
          print('::notice title=Xcode::' + ' '.join(current()))
          PY
      - name: Prepara il progetto con le pagine del sito
        run: |
          mkdir -p build && unzip -q giocapensa-ios.zip -d build
          python3 build/ios-progetto/prepara_www.py . build/ios-progetto/ios/App/App/public build/ios-progetto/fonts
      - name: Chiave di App Store Connect
        env:
          P8: ${{ secrets.APPSTORE_P8 }}
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          KEY_ID="${KEY_ID//[[:space:]]/}"
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$P8" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
      - name: Compila e firma
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          VERSIONE: ${{ inputs.versione || '1.0' }}
        run: |
          set -o pipefail
          TEAM="${TEAM//[[:space:]]/}"; KEY_ID="${KEY_ID//[[:space:]]/}"; ISSUER="${ISSUER//[[:space:]]/}"
          [[ "$VERSIONE" =~ ^[0-9]+(\.[0-9]+){0,2}$ ]] || { echo "::error title=Versione::Versione non valida: «$VERSIONE». Usa numeri e punti, per esempio 1.1"; exit 1; }
          cd build/ios-progetto/ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY=- AD_HOC_CODE_SIGNING_ALLOWED=YES \
            MARKETING_VERSION="$VERSIONE" CURRENT_PROJECT_VERSION=${{ github.run_number }}.${{ github.run_attempt }} \
            archive 2>&1 | tee "$RUNNER_TEMP/compila.log"
          # the age check uses DeclaredAgeRange, which exists only from iOS 26: it must be linked weakly,
          # or the app would not even start on older iOS
          APP="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          link=$(otool -l "$APP/App" | awk '/^ *cmd /{c=$2} /^ *name .*DeclaredAgeRange/ && !d {print c; d=1}')
          case "$link" in
            LC_LOAD_WEAK_DYLIB) echo "::notice title=Controllo dell'età::DeclaredAgeRange collegato in modo debole: l'app parte anche sugli iOS più vecchi." ;;
            "") echo "::error title=Controllo dell'età::DeclaredAgeRange non risulta collegato all'app."; exit 1 ;;
            *) echo "::error title=Controllo dell'età::DeclaredAgeRange è collegato con $link: sugli iOS prima del 26 l'app non partirebbe."; exit 1 ;;
          esac
          ent=$(codesign -d --entitlements - "$APP" 2>&1 || true)   # read whole: grep -q would cut the pipe under pipefail
          [[ "$ent" == *declared-age-range* ]] \
            || { echo "::error title=Controllo dell'età::Nell'archivio manca il permesso com.apple.developer.declared-age-range."; exit 1; }
      - name: Invia ad App Store Connect
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          TEAM="${TEAM//[[:space:]]/}"; KEY_ID="${KEY_ID//[[:space:]]/}"; ISSUER="${ISSUER//[[:space:]]/}"
          # a dry run signs for the App Store exactly the same way, but keeps the app here instead of sending it
          DEST=upload; [ "$PROVA" = true ] && DEST=export
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>$DEST</string>
          <key>teamID</key><string>$TEAM</string>
          <key>signingStyle</key><string>automatic</string>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" 2>&1 | tee "$RUNNER_TEMP/invia.log"
          if [ "$PROVA" = true ]; then
            mkdir -p "$RUNNER_TEMP/ipa" && unzip -q "$RUNNER_TEMP"/export/*.ipa -d "$RUNNER_TEMP/ipa"
            ent=$(codesign -d --entitlements - "$RUNNER_TEMP/ipa/Payload/App.app" 2>&1 || true)
            [[ "$ent" == *declared-age-range* ]] \
              || { echo "::error title=Prova::La firma per l'App Store non contiene il permesso dell'età: sull'identificativo dell'app va attivato «Declared Age Range»."; exit 1; }
            echo "::notice title=Prova::App compilata e firmata per l'App Store, con il controllo dell'età. Non è stata inviata ad Apple."
          fi
      - name: Spiega l'errore
        # the lines that say why it failed become annotations: they show on the run page and can be read from the GitHub API
        if: failure()
        run: |
          for f in compila invia; do
            [ -f "$RUNNER_TEMP/$f.log" ] || continue
            grep -E "error:|ITMS-[0-9]+|Error Domain=|Validation failed|Upload failed|No suitable application records|ARCHIVE FAILED|EXPORT FAILED" "$RUNNER_TEMP/$f.log" \
              | sed -E 's/^[[:space:]]+//' | awk '!seen[$0]++' | head -n 8 | while IFS= read -r l; do
                l=${l//%/%25}; echo "::error title=$f::${l:0:700}"
              done
          done
