name: Scheda App Store
on:
  workflow_dispatch:
    inputs:
      versione:
        description: "Versione da compilare (lascia vuoto: quella in preparazione)"
        required: false
        default: ""
jobs:
  scheda:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Strumenti
        run: python -m pip install --quiet "pyjwt[crypto]>=2.8,<3"
      - name: Compila la scheda
        # texts, categories, copyright and screenshots of scheda/ in every language; messages for the parent come out as annotations
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
          VERSIONE: ${{ inputs.versione }}
        run: python scheda/carica.py scheda
