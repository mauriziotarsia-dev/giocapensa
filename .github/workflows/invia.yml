name: Invio alla revisione
on:
  workflow_dispatch:
    inputs:
      davvero:
        description: "Invia davvero (senza la spunta è solo una prova che non cambia niente)"
        type: boolean
        default: false
  push:
    # Claude: a push on invia-prova only reads and says what it would do; a push on invia-asc sends the version to App Review
    branches: [invia-prova, invia-asc]
jobs:
  invia:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Strumenti
        run: python -m pip install --quiet "pyjwt[crypto]>=2.8,<3"
      - name: Invia
        # build, review notes, release date and submission of the version written in scheda/testi.json; every step goes out as an annotation
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_P8: ${{ secrets.APPSTORE_P8 }}
          DAVVERO: ${{ github.ref_name == 'invia-asc' || inputs.davvero == true }}
        run: |
          if [ "$DAVVERO" = true ]; then
            python scheda/carica.py scheda --invia --davvero
          else
            python scheda/carica.py scheda --invia
          fi
