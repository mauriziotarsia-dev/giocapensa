<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Labirinti</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&display=swap">
<style>
:root{
  color-scheme: light;
  --page:#FDF3E3; --ink:#4A3B52; --ink-2:#7A6B80; --surface:#FFFFFF; --line:#E7D6C2; --joy:#FF8A3D;
  --b-r:#F47C7C; --b-y:#FFD95A; --b-b:#7DB7F7; --b-g:#8DD68A; --b-p:#B98CD6;
  --font:"Overpass","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark; --page:#241E28; --ink:#F2E8DC; --ink-2:#B3A6B8; --surface:#332B38; --line:#4B3F52; }
}
:root[data-theme="dark"]{ color-scheme:dark; --page:#241E28; --ink:#F2E8DC; --ink-2:#B3A6B8; --surface:#332B38; --line:#4B3F52; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  background:var(--page); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.35; overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
button{font-family:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
button:focus-visible{outline:3px solid var(--joy); outline-offset:2px}
[hidden]{display:none !important}

.app{max-width:560px; height:100vh; height:100dvh; margin:0 auto; padding:max(8px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px}
.bar{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; flex:none}
.pill{justify-self:start; display:inline-flex; align-items:center; gap:8px; height:40px; padding:2px 15px 0 12px; border-radius:20px; border:0; box-shadow:0 0 0 2.5px var(--ink); background:var(--surface); font-weight:800; font-size:.9375rem}
.pill svg{width:19px; height:19px; margin-top:-2px}
.where{display:flex; align-items:center; gap:10px}
.badge{min-width:40px; height:40px; padding:2px 7px 0; border-radius:20px; display:grid; place-items:center; background:var(--tier); color:var(--tier-ink); box-shadow:0 0 0 2.5px var(--ink); font-weight:900; font-size:1.0625rem; font-variant-numeric:tabular-nums}
.wtxt{display:flex; flex-direction:column; line-height:1.15}
.wtxt strong{font-weight:900; font-size:1rem}
.wtxt span{color:var(--ink-2); font-size:.8125rem}
.stats{display:flex; justify-content:center; gap:22px; color:var(--ink-2); font-size:.9375rem; flex:none}
.stats b{color:var(--ink); font-weight:900; font-variant-numeric:tabular-nums; margin-left:4px}

.stage{flex:1; min-height:0; display:grid; place-items:center}
.scene{display:block; width:100%; height:100%; max-height:100%; border-radius:22px; box-shadow:0 0 0 3px var(--ink), 0 12px 24px -16px rgba(0,0,0,.45); background:#FFEEDC; overflow:hidden; touch-action:none}

/* everything that moves pivots on its own box */
.bi,.rm,.spark,.cork,.ring2,.arrowG{transform-box:fill-box; transform-origin:50% 50%}
.bi{transform-origin:50% 100%}
.blink{transform-box:fill-box; transform-origin:50% 50%; animation:blink 4.6s ease-in-out infinite; animation-delay:var(--d,0s)}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.ball.lifted .bi{animation:wiggle .7s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.ball.land .bi{animation:land .34s cubic-bezier(.3,.7,.3,1)}
@keyframes land{0%{transform:scale(1.18,.8)}45%{transform:scale(.92,1.1)}100%{transform:none}}
.ball.party .bi{animation:party .7s cubic-bezier(.3,.7,.3,1) var(--pd,0s) 2}
@keyframes party{0%,100%{transform:none}35%{transform:translateY(-34px) scale(.94,1.08)}60%{transform:scale(1.1,.9)}}
.tube.nope{animation:nope .3s ease-in-out}
@keyframes nope{20%{transform:translateX(-9px)}50%{transform:translateX(9px)}80%{transform:translateX(-5px)}}
.cork{opacity:0; transform:translateY(-46px) scale(.5)}
.tube.done .cork{opacity:1; transform:none; transition:transform .42s cubic-bezier(.2,1.6,.4,1), opacity .15s}
.tint{opacity:0; transition:opacity .4s}
.tube.done .tint{opacity:.3}
.rm.flag{transform-origin:50% 0%; animation:flag 3.2s ease-in-out infinite; animation-delay:var(--d)}
@keyframes flag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(8deg)}}
.spark{animation:spark .7s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes spark{0%{transform:translate(0,0) scale(.2) rotate(0); opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(150deg); opacity:0}}
.ring2{fill:none; stroke:var(--joy); stroke-width:8; stroke-dasharray:16 14; stroke-linecap:round; animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-60}}
.arrowG{animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-8px)}}

.status{margin:0; min-height:2.6em; display:grid; place-items:center; text-align:center; color:var(--ink-2); font-size:.9375rem; padding:0 6px; text-wrap:balance; flex:none}
.controls{display:flex; justify-content:center; gap:clamp(16px,8vw,40px); flex:none}
.sign{position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:76px; padding:2px; border:0; background:none; font-weight:800; font-size:.8125rem}
.disc{width:56px; height:56px; border-radius:50%; display:grid; place-items:center; background:var(--surface); box-shadow:0 0 0 2.5px var(--ink), 0 4px 0 0 var(--ink); transition:transform .1s ease-out, box-shadow .1s}
.disc svg{width:26px; height:26px}
.sign:active .disc{transform:translateY(3px); box-shadow:0 0 0 2.5px var(--ink), 0 1px 0 0 var(--ink)}
.sign:disabled{cursor:default; color:var(--ink-2)}
.sign:disabled .disc{opacity:.4; transform:none}
.ring{display:none; position:absolute; top:-2px; left:50%; width:64px; height:64px; margin-left:-32px; transform:rotate(-90deg); pointer-events:none}
.ring circle{fill:none; stroke-width:4.5; stroke-linecap:round}
.ring .bg{stroke:var(--ink-2); opacity:.28}
.ring .fill{stroke:var(--joy); transition:stroke-dashoffset .3s linear}
.sign.waiting .ring{display:block}

.result{position:fixed; z-index:20; left:0; right:0; bottom:0; max-width:560px; margin:0 auto; background:var(--surface); border-radius:26px 26px 0 0; padding:22px 20px max(20px,env(safe-area-inset-bottom)); text-align:center; box-shadow:0 0 0 3px var(--ink); transform:translateY(108%); transition:transform .36s cubic-bezier(.2,.9,.25,1)}
.result.show{transform:none}
.result h2{margin:0; font-weight:900; font-size:1.875rem; letter-spacing:-.01em; line-height:1.1}
.result .perfect{display:inline-flex; align-items:center; gap:6px; margin:10px 0 0; padding:5px 12px 3px 9px; border-radius:16px; background:#FFD95A; color:#4A3B52; box-shadow:0 0 0 2.5px #4A3B52; font-weight:900; font-size:.875rem}
.result .perfect svg{width:16px; height:16px; margin-top:-3px}
.result p{margin:10px auto 0; max-width:34ch; color:var(--ink-2); text-wrap:balance}
.actions{display:flex; gap:10px; margin-top:18px}
.btn{flex:1; height:50px; padding:2px 14px 0; border-radius:25px; border:0; box-shadow:0 0 0 2.5px var(--ink); background:var(--surface); font-weight:900; font-size:1rem}
.btn.primary{flex:1.6; background:var(--ink); color:var(--page)}
.btn:active{transform:scale(.98)}

dialog{color:var(--ink); font-family:var(--font)}
dialog::backdrop{background:rgba(40,28,48,.55)}
.sheet{width:100%; max-width:560px; height:100%; max-height:100vh; max-height:100dvh; margin:0 auto; padding:0; border:0; background:var(--page); overflow:hidden}
.sheet[open]{display:flex; flex-direction:column}
.sheet-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:max(14px,env(safe-area-inset-top)) 14px 12px 16px; border-bottom:2.5px solid var(--ink)}
.sheet-head h2{margin:0; font-weight:900; font-size:1.5rem; line-height:1.15}
.sheet-head p{margin:3px 0 0; color:var(--ink-2); font-size:.875rem}
.round{width:40px; height:40px; border-radius:50%; border:0; background:var(--surface); box-shadow:0 0 0 2.5px var(--ink); display:grid; place-items:center; flex:none}
.round svg{width:19px; height:19px}
.sheet-body{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:6px 14px max(24px,env(safe-area-inset-bottom))}
.tier h3{display:flex; align-items:baseline; gap:8px; margin:18px 2px 10px; font-weight:900; font-size:1.0625rem}
.tier h3 i{width:13px; height:13px; border-radius:50%; background:var(--tier); box-shadow:0 0 0 2px var(--ink); align-self:center; margin-top:-3px}
.tier h3 small{font-weight:400; font-size:.8125rem; color:var(--ink-2)}
.tier h3 em{margin-left:auto; font-style:normal; font-weight:600; font-size:.8125rem; color:var(--ink-2)}
.cells{display:grid; grid-template-columns:repeat(8,1fr); gap:8px}
.lv{position:relative; aspect-ratio:1; padding:2px 0 0; border-radius:50%; border:0; box-shadow:0 0 0 2px var(--line); background:var(--surface); font-weight:900; font-size:.875rem; font-variant-numeric:tabular-nums; display:grid; place-items:center}
.lv.done{background:var(--tier); color:var(--tier-ink); box-shadow:0 0 0 2px var(--ink)}
.lv.perfect::after{content:"★"; position:absolute; top:-6px; right:-5px; width:17px; height:17px; border-radius:50%; display:grid; place-items:center; background:var(--page); color:var(--ink); font-size:11px; line-height:1}
.lv.current{box-shadow:0 0 0 2px var(--page), 0 0 0 5px var(--ink)}
.rules{margin:24px 2px 0; padding:16px 0 0; border-top:2.5px solid var(--line); color:var(--ink-2); font-size:.9375rem}
.rules h3{margin:0 0 6px; color:var(--ink); font-weight:900; font-size:1.0625rem}
.rules ul{margin:0; padding-left:1.1em} .rules li{margin:4px 0; max-width:60ch}

@media (prefers-reduced-motion: reduce){
  .blink,.ball .bi,.rm,.spark,.ring2,.arrowG,.tube.nope{animation:none !important}
  .tube.done .cork,.result{transition-duration:.01s !important}
}

.bar{display:flex; justify-content:space-between}
.lft{display:flex; align-items:center; gap:7px}
a.round{color:inherit; text-decoration:none}
.scene{background:var(--scene-bg,#FFEEDC)}

.conf{transform-box:fill-box; transform-origin:50% 50%; opacity:0; animation:conf var(--t,2.4s) cubic-bezier(.25,.3,.6,1) var(--dl,0s) forwards}
@keyframes conf{0%{opacity:1; transform:translate(0,0) rotate(0)}100%{opacity:1; transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.world{animation:worldin .5s cubic-bezier(.2,.9,.3,1)}
@keyframes worldin{from{opacity:0; transform:translateY(18px)}}
.bfly{animation:bfly var(--bt,19s) ease-in-out infinite; animation-delay:var(--bd,0s)}
@keyframes bfly{0%{transform:translate(calc(var(--w) * -.08), calc(var(--h) * .72))}25%{transform:translate(calc(var(--w) * .28), calc(var(--h) * .18))}50%{transform:translate(calc(var(--w) * .66), calc(var(--h) * .52))}75%{transform:translate(calc(var(--w) * .9), calc(var(--h) * .12))}100%{transform:translate(calc(var(--w) * 1.1), calc(var(--h) * .6))}}
.bwL,.bwR{transform-box:fill-box; animation:bflap .24s ease-in-out infinite alternate}
.bwL{transform-origin:100% 50%} .bwR{transform-origin:0% 50%}
@keyframes bflap{to{transform:scaleX(.3)}}
.drift{animation:drift var(--bt,46s) linear infinite; animation-delay:var(--bd,0s)}
@keyframes drift{from{transform:translateX(calc(var(--w) * -.5))}to{transform:translateX(calc(var(--w) * 1.4))}}
@media (prefers-reduced-motion: reduce){ .conf,.world,.bfly,.bwL,.bwR,.drift{animation:none !important} }
.part,.item,.gate,.hdot,.chr,.house,.leaf,.smoke,.glow,.armL,.armR,.footL,.footR,.earL,.earR,.dust,.glint,.hfl{transform-box:fill-box; transform-origin:50% 50%}
.glow{animation:glow 1.7s ease-in-out infinite; animation-delay:var(--d,0s)}
@keyframes glow{0%,100%{transform:scale(.82); opacity:.75}50%{transform:scale(1.12); opacity:1}}
.item.twk .spinme{transform-box:fill-box; transform-origin:50% 50%; animation:twk 2.2s ease-in-out infinite; animation-delay:var(--d,0s)}
@keyframes twk{0%,100%{transform:scale(1) rotate(-10deg)}50%{transform:scale(1.12) rotate(10deg)}}
.item.bobk{animation:bobk 2.2s ease-in-out infinite}
@keyframes bobk{50%{transform:translateY(-9px) rotate(7deg)}}
.glint{animation:glint 2.4s ease-in-out infinite}
@keyframes glint{0%,70%,100%{opacity:0; transform:scale(.3)}80%{opacity:1; transform:scale(1.2) rotate(40deg)}}
.item.got{animation:got .5s cubic-bezier(.3,.7,.3,1) forwards}
@keyframes got{40%{transform:translateY(-30px) scale(1.5); opacity:1}100%{transform:translateY(-90px) scale(.3) rotate(200deg); opacity:0}}
.gate{transform-origin:0% 50%; transition:transform .55s cubic-bezier(.5,0,.2,1), opacity .4s .25s}
.gate.open{transform:scaleX(.06); opacity:0}
.boulder{transform-box:fill-box; transform-origin:50% 50%; transition:transform .8s cubic-bezier(.5,0,.3,1)}
.house.ready .boulder{transform:translate(44px,8px) rotate(150deg)}
.winlight{opacity:0; transition:opacity .5s .4s}
.house.ready .winlight{opacity:.8}
.tailw{transform-box:fill-box; transform-origin:100% 60%; animation:tailw 1.6s ease-in-out infinite}
@keyframes tailw{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
.chr.walk .tailw{animation-duration:.4s}
.house.ready{animation:ready 1.5s ease-in-out infinite}
@keyframes ready{50%{transform:scale(1.06)}}
.house.no{animation:nope .3s ease-in-out}
.smoke{animation:smoke 3.2s ease-out infinite; animation-delay:var(--d,0s); opacity:0}
@keyframes smoke{0%{opacity:0; transform:translate(0,0) scale(.4)}20%{opacity:.75}100%{opacity:0; transform:translate(14px,-46px) scale(1.5)}}
.hfl{animation:hfl 3s ease-in-out infinite; animation-delay:var(--d,0s)}
@keyframes hfl{50%{transform:scale(1.2) rotate(18deg)}}
.hdot{animation:hdot 1s ease-in-out infinite; animation-delay:var(--d,0s)}
@keyframes hdot{0%,100%{transform:scale(.7); opacity:.6}50%{transform:scale(1.15); opacity:1}}
.chr .bi{transform-box:fill-box; transform-origin:50% 100%; animation:breathe2 2.6s ease-in-out infinite}
@keyframes breathe2{50%{transform:scale(1.03,.97)}}
.earL{transform-origin:70% 90%; animation:earw 5s ease-in-out infinite} .earR{transform-origin:30% 90%; animation:earw 5s ease-in-out infinite .2s}
@keyframes earw{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-16deg)}95%{transform:rotate(10deg)}}
.chr.walk .bi{animation:bobw .19s ease-in-out infinite alternate}
@keyframes bobw{to{transform:translateY(-5px) rotate(2deg)}}
.footL,.footR{transform-origin:50% 0%}
.chr.walk .footL{animation:foot .2s ease-in-out infinite alternate} .chr.walk .footR{animation:foot .2s ease-in-out infinite alternate-reverse}
@keyframes foot{from{transform:translate(-4px,0) rotate(8deg)}to{transform:translate(6px,-6px) rotate(-10deg)}}
.chr.walk .armL{animation:armw .2s ease-in-out infinite alternate} .chr.walk .armR{animation:armw .2s ease-in-out infinite alternate-reverse}
@keyframes armw{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
.armL{transform-origin:80% 10%} .armR{transform-origin:20% 10%}
.chr.joy .bi{animation:party .7s cubic-bezier(.3,.7,.3,1) 4}
.chr.joy .armL{animation:none; transform:rotate(140deg)} .chr.joy .armR{animation:none; transform:rotate(-140deg)}
.dust{animation:dust .5s ease-out forwards}
@keyframes dust{from{transform:scale(.4); opacity:.7}to{transform:scale(1.9); opacity:0}}
.flip{transform-box:fill-box; transform-origin:50% 50%; transition:transform .12s}
@media (prefers-reduced-motion: reduce){ .glow,.item,.item .spinme,.glint,.house,.smoke,.hfl,.hdot,.chr .bi,.earL,.earR,.footL,.footR,.armL,.armR,.dust{animation:none !important} }
.pond{transform-box:fill-box; transform-origin:50% 50%; animation:pond 3.2s ease-in-out infinite; animation-delay:var(--d,0s)}
@keyframes pond{0%,100%{transform:scale(.7); opacity:.2}50%{transform:scale(1.1); opacity:.8}}
.frog{transform-box:fill-box; transform-origin:50% 100%; animation:frog 4.5s ease-in-out infinite}
@keyframes frog{0%,84%,100%{transform:none}90%{transform:translateY(-12px) scale(1.04,.96)}95%{transform:scale(.97,1.03)}}
@media (prefers-reduced-motion: reduce){ .pond,.frog{animation:none !important} }
</style>
</head>
<body>
<main class="app" id="app">
  <header class="bar">
    <div class="lft">
      <a class="round" id="btnHome" href="index.html" hidden aria-label="Tutti i giochi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg></a>
      <button class="pill" id="btnLevels" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>Livelli</button>
    </div>
    <div class="where"><div class="badge" id="badge">1</div><div class="wtxt"><strong id="tierName"></strong><span id="lvOf"></span></div></div>
  </header>
  <div class="stats"><span><span id="lblMoves">Mosse</span><b id="statMoves">0</b></span><span>Minimo<b id="statMin">0</b></span><span>Record<b id="statBest">–</b></span></div>
  <div class="stage"><svg class="scene" id="scene" preserveAspectRatio="xMidYMid meet"></svg></div>
  <p class="status" id="status" aria-live="polite"></p>
  <nav class="controls" id="controls" aria-label="Comandi">
    <button class="sign" id="btnUndo" type="button"><span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5L3 10l5 5"/><path d="M3 10h11a5.5 5.5 0 010 11h-3"/></svg></span>Annulla</button>
    <button class="sign" id="btnReset" type="button"><span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 11-2.6-5.9"/><path d="M20 3.5V9h-5.5"/></svg></span>Ricomincia</button>
    <button class="sign" id="btnHint" type="button"><svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle class="bg" cx="32" cy="32" r="30"/><circle class="fill" id="ringFill" cx="32" cy="32" r="30" stroke-dasharray="188.5" stroke-dashoffset="188.5"/></svg><span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 18.5h5M10.5 21.5h3"/><path d="M12 2.8a6 6 0 00-3.7 10.7c.7.6 1.1 1.4 1.1 2.3h5.2c0-.9.4-1.7 1.1-2.3A6 6 0 0012 2.8z"/></svg></span>Aiuto</button>
  </nav>
</main>
<section class="result" id="result" hidden aria-live="polite">
  <h2 id="resTitle"></h2>
  <div class="perfect" id="resPerfect" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg><span id="resPerfectTxt"></span></div>
  <p id="resText"></p>
  <div class="actions"><button class="btn" id="btnAgain" type="button">Rigioca</button><button class="btn primary" id="btnNext" type="button">Livello successivo</button></div>
</section>
<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-head"><div><h2 id="sheetTitle">Livelli</h2><p id="sheetSummary"></p></div>
    <button class="round" id="btnCloseSheet" type="button" aria-label="Chiudi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="sheet-body" id="sheetBody"></div>
</dialog>

<script>window.KIT_HOME = 'index.html';</script>
<script id="sound">
/* Shared sound engine. Every effect is synthesised on the spot with Web Audio (no audio files): small "instruments"
   (marimba, bell, pop, thud, whoosh, boing, bubbles, pad) played through a soft compressor and a little room reverb.
   On iPhone Web Audio follows the ring/silent switch. Use: SFX.play('place', { i: 3 }) or SFX.play('drop', { note: 659.25 }). */
window.SFX = (function () {
  'use strict';
  var AC = window.AudioContext || window.webkitAudioContext, ctx = null, dry = null, wet = null, noiseBuf = null, forced = null;
  var PENTA = [1, 9 / 8, 5 / 4, 3 / 2, 5 / 3], MAJOR = [1, 9 / 8, 5 / 4, 4 / 3, 3 / 2, 5 / 3, 15 / 8];
  function penta(i) { i = Math.max(0, i | 0); return 523.25 * PENTA[i % 5] * Math.pow(2, Math.floor(i / 5)); }
  function major(i) { i = Math.max(0, i | 0); return 523.25 * MAJOR[i % 7] * Math.pow(2, Math.floor(i / 7)); }

    raf = 0; if (K.isWon()) return;
    var dt = lastT ? Math.min(48, t - lastT) : 16; lastT = t;
    var left = K.calm ? 1e9 : (SPEED + 70 * Math.min(way.length, 6)) * dt / 1000;        // a long trace ahead: hurry up a little
    while (left > 0 && way.length) {
      var wp = way[0], dx = cx(wp.c) - chr._x, dy = cy(wp.c) - chr._y, dist = Math.abs(dx) + Math.abs(dy);   // corridors run straight: one of the two is always zero
      if (Math.abs(dx) > 0.5) chr.querySelector('.flip').style.transform = dx < 0 ? 'scaleX(-1)' : '';
      if (dist <= left) { setChr(cx(wp.c), cy(wp.c)); left -= dist; way.shift(); if (wp.count && !arrive(wp.c)) return; }
      else { setChr(chr._x + (dx > 0 ? left : dx < 0 ? -left : 0), chr._y + (dy > 0 ? left : dy < 0 ? -left : 0)); left = 0; }
    }
    if (way.length) raf = requestAnimationFrame(frame); else { walking = false; lastT = 0; chr.classList.remove('walk'); K.changed(); }
  }
  function go() { if (way.length && !raf) { walking = true; chr.classList.add('walk'); lastT = 0; raf = requestAnimationFrame(frame); K.changed(); } }
  function cellAt(x, y) {
    var b = scene.getBoundingClientRect(), s = Math.min(b.width / W, b.height / H), px = (x - b.left - (b.width - W * s) / 2) / s - PAD, py = (y - b.top - (b.height - H * s) / 2) / s - PAD;
    var gx = Math.floor(px / C), gy = Math.floor(py / C); if (gx < 0 || gy < 0 || gx >= G.w || gy >= G.h) return -1; return gy * G.w + gx;
  }
  function straight(a, b, max, key) {                            // same corridor, nothing in between
    var ax = a % G.w, ay = Math.floor(a / G.w), bx = b % G.w, bq = Math.floor(b / G.w), d, c = a, out = [];
    if ((ax !== bx && ay !== bq) || Math.abs(bx - ax) + Math.abs(bq - ay) > max) return null;
    d = ax === bx ? (bq > ay ? 2 : 0) : (bx > ax ? 1 : 3);
    while (c !== b) { if (LB.blocked(G, c, d, key)) return null; c = LB.nb(G, c, d); out.push(c); }
    return out;
  }
  function aim(x, y) {                                           // the finger draws the way, cell by cell; a touch far away is not a way
    if (K.isWon()) return; var t = cellAt(x, y), k; if (t < 0 || t === lastAim) return; lastAim = t; clearHint();
    var tail = way.length ? way[way.length - 1].c : st.c; if (t === tail) return;
    for (k = 0; k < way.length; k++) if (way[k].count && way[k].c === t) { way.length = k + 1; return; }            // the finger went back along its own trace
    if (t === st.c) { way = mid() ? [{ c: st.c, count: false }] : []; go(); return; }                               // back to where it last stood
    var key = st.key || way.some(function (w) { return w.c === G.key; }) ? 1 : 0;
    var path = LB.route(G, tail, t, key, 3) || straight(tail, t, 5, key); if (!path) return;
    way = way.concat(path.map(function (c) { return { c: c, count: true }; })); go();
  }
  scene.addEventListener('pointerdown', function (e) { if (e.pointerType === 'mouse' && e.button !== 0) return; e.preventDefault(); down = true; lastAim = -1; try { scene.setPointerCapture(e.pointerId); } catch (err) {} aim(e.clientX, e.clientY); });
  scene.addEventListener('pointermove', function (e) { if (down) aim(e.clientX, e.clientY); });
  function up() { down = false; lastAim = -1; }
  scene.addEventListener('pointerup', up); scene.addEventListener('pointercancel', up);
  scene.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  function clearHint() { if (hintG) hintG.innerHTML = ''; }
  K.start({
    key: 'labirinti.v1', count: RAW.length, perTier: 24, moveLabel: 'Passi', word: ['passo', 'passi'], winTitle: 'Arrivato alla grotta!', winDelay: 1500,
    intro: 'Trascina il dito lungo il sentiero: il dinosauro ti segue fino alla sua grotta. Non si passa attraverso le siepi.',
    rules: ['Porta il dinosauro alla sua grotta tracciando il sentiero con il dito: lui segue il percorso disegnato, le siepi non si attraversano.', 'Un tocco lontano non lo fa partire: il percorso va tracciato casella dopo casella.', 'Se ci sono stelle, vanno raccolte tutte prima che il masso liberi la grotta.', 'Il cancello si apre solo dopo aver preso la chiave.', 'Ogni casella percorsa conta un passo, anche quando si torna indietro.'],
    minOf: function (i) { return RAW[i].m; }, load: load, moves: function () { return hist ? hist.length : 0; }, canUndo: function () { return hist && hist.length > 0 && !walking; },
    undo: function () { way = []; var p = hist.pop(); st = p; setChr(cx(p.c), cy(p.c)); if (trailG.lastElementChild) trailG.removeChild(trailG.lastElementChild); refreshItems(); K.sfx('back'); K.changed(); },
    clearHint: clearHint,
    hint: function () {
      if (walking) return null; var path = LB.solve(G, st); if (!path || !path.length) return null;
      hintG.innerHTML = path.slice(0, 6).map(function (c, n) { return '<g class="hdot" style="--d:' + (n * 0.12) + 's"><circle cx="' + cx(c) + '" cy="' + cy(c) + '" r="34" fill="url(#gHint)"/>' + dot(cx(c), cy(c), 11, '#FFF4D9') + '</g>'; }).join('');
      return 'Segui i puntini arancioni. Da qui mancano ' + path.length + ' passi.';
    }
  });
})();

</script>
