<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palline nei tubi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&display=swap">
<style>
:root{
  color-scheme: light;
  --page:#FDF3E3; --ink:#4A3B52; --ink-2:#7A6B80; --surface:#FFFFFF; --line:#E7D6C2; --joy:#FF8A3D;
  --b-r:#EE5E4D; --b-y:#FFD95A; --b-b:#5FA4F2; --b-g:#7CCB78; --b-p:#F5903A;
  --font:"Overpass","Helvetica Neue",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ color-scheme:dark; --page:#241E28; --ink:#F2E8DC; --ink-2:#B3A6B8; --surface:#332B38; --line:#4B3F52; }
}
:root[data-theme="dark"]{ color-scheme:dark; --page:#241E28; --ink:#F2E8DC; --ink-2:#B3A6B8; --surface:#332B38; --line:#4B3F52; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{
  background:var(--page); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.35; overflow:hidden;
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
button{font-family:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
button:focus-visible{outline:3px solid var(--joy); outline-offset:2px}
[hidden]{display:none !important}

.app{max-width:560px; height:100vh; height:100dvh; margin:0 auto; padding:max(8px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:8px}
.bar{display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; flex:none}
.pill{justify-self:start; display:inline-flex; align-items:center; gap:8px; height:40px; padding:2px 15px 0 12px; border-radius:20px; border:0; box-shadow:0 0 0 2.5px var(--ink); background:var(--surface); font-weight:800; font-size:.9375rem; white-space:nowrap; flex:none}
.pill svg{width:19px; height:19px; margin-top:-2px}
.where{display:flex; align-items:center; gap:10px}
.badge{min-width:40px; height:40px; padding:2px 7px 0; border-radius:20px; display:grid; place-items:center; background:var(--tier); color:var(--tier-ink); box-shadow:0 0 0 2.5px var(--ink); font-weight:900; font-size:1.0625rem; font-variant-numeric:tabular-nums}
.wtxt{display:flex; flex-direction:column; line-height:1.15}
.wtxt strong{font-weight:900; font-size:1rem}
.wtxt span{color:var(--ink-2); font-size:.8125rem}
.stats{display:flex; justify-content:center; gap:22px; color:var(--ink-2); font-size:.9375rem; flex:none}
.stats b{color:var(--ink); font-weight:900; font-variant-numeric:tabular-nums; margin-left:4px}

.stage{flex:1; min-height:0; display:grid; place-items:center; touch-action:none}
.scene{display:block; width:100%; height:100%; max-height:100%; border-radius:22px; box-shadow:0 0 0 3px var(--ink), 0 12px 24px -16px rgba(0,0,0,.45); background:#FFEEDC; overflow:hidden; touch-action:none}

/* everything that moves pivots on its own box */
.bi,.rm,.spark,.cork,.ring2,.arrowG{transform-box:fill-box; transform-origin:50% 50%}
.bi{transform-origin:50% 100%}
.blink{transform-box:fill-box; transform-origin:50% 50%; animation:blink 4.6s ease-in-out infinite; animation-delay:var(--d,0s)}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.mO{opacity:0} .ball.lifted .mO{opacity:1} .ball.lifted .mN{opacity:0}
.conf{transform-box:fill-box; transform-origin:50% 50%; opacity:0; animation:conf var(--t,2.4s) cubic-bezier(.25,.3,.6,1) var(--dl,0s) forwards}
@keyframes conf{0%{opacity:1; transform:translate(0,0) rotate(0)}100%{opacity:1; transform:translate(var(--x),var(--y)) rotate(var(--r))}}
.ball.lifted .bi{animation:wiggle .7s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.ball.land .bi{animation:land .34s cubic-bezier(.3,.7,.3,1)}
@keyframes land{0%{transform:scale(1.18,.8)}45%{transform:scale(.92,1.1)}100%{transform:none}}
.ball.party .bi{animation:party .7s cubic-bezier(.3,.7,.3,1) var(--pd,0s) 2}
@keyframes party{0%,100%{transform:none}35%{transform:translateY(-34px) scale(.94,1.08)}60%{transform:scale(1.1,.9)}}
.tube.nope{animation:nope .3s ease-in-out}
@keyframes nope{20%{transform:translateX(-9px)}50%{transform:translateX(9px)}80%{transform:translateX(-5px)}}
.cork{opacity:0; transform:translateY(-46px) scale(.5)}
.tube.done .cork{opacity:1; transform:none; transition:transform .42s cubic-bezier(.2,1.6,.4,1), opacity .15s}
.tint{opacity:0; transition:opacity .4s}
.tube.done .tint{opacity:.3}
.rm.flag{transform-origin:50% 0%; animation:flag 3.2s ease-in-out infinite; animation-delay:var(--d)}
@keyframes flag{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(8deg)}}
.spark{animation:spark .7s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes spark{0%{transform:translate(0,0) scale(.2) rotate(0); opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(150deg); opacity:0}}
.ring2{fill:none; stroke:var(--joy); stroke-width:8; stroke-dasharray:16 14; stroke-linecap:round; animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-60}}
.arrowG{animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-8px)}}

.status{margin:0; min-height:2.6em; display:grid; place-items:center; text-align:center; color:var(--ink-2); font-size:.9375rem; padding:0 6px; text-wrap:balance; flex:none}
.controls{display:flex; justify-content:center; gap:clamp(16px,8vw,40px); flex:none}
.sign{position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; min-width:76px; padding:2px; border:0; background:none; font-weight:800; font-size:.8125rem}
.disc{width:56px; height:56px; border-radius:50%; display:grid; place-items:center; background:var(--surface); box-shadow:0 0 0 2.5px var(--ink), 0 4px 0 0 var(--ink); transition:transform .1s ease-out, box-shadow .1s}
.disc svg{width:26px; height:26px}
.sign:active .disc{transform:translateY(3px); box-shadow:0 0 0 2.5px var(--ink), 0 1px 0 0 var(--ink)}
.sign:disabled{cursor:default; color:var(--ink-2)}
.sign:disabled .disc{opacity:.4; transform:none}
.ring{display:none; position:absolute; top:-2px; left:50%; width:64px; height:64px; margin-left:-32px; transform:rotate(-90deg); pointer-events:none}
.ring circle{fill:none; stroke-width:4.5; stroke-linecap:round}
.ring .bg{stroke:var(--ink-2); opacity:.28}
.ring .fill{stroke:var(--joy); transition:stroke-dashoffset .3s linear}
.sign.waiting .ring{display:block}

#lvOf{white-space:nowrap}
@media (max-width:370px){ .bar{gap:5px} .bar .pill span{display:none} .bar .pill{padding-left:12px; padding-right:12px} #lvOf{display:none} }
.result{position:fixed; z-index:20; left:0; right:0; bottom:0; max-width:560px; margin:0 auto; background:var(--surface); border-radius:26px 26px 0 0; padding:22px 20px max(20px,env(safe-area-inset-bottom)); text-align:center; box-shadow:0 0 0 3px var(--ink); transform:translateY(108%); transition:transform .36s cubic-bezier(.2,.9,.25,1)}
.result.show{transform:none}
.result h2{margin:0; font-weight:900; font-size:1.875rem; letter-spacing:-.01em; line-height:1.1}
.result.show .perfect{animation:badge .6s cubic-bezier(.2,1.6,.4,1) .25s both}
@keyframes badge{0%{transform:scale(.3) rotate(-12deg)}60%{transform:scale(1.15) rotate(5deg)}100%{transform:none}}
.result .perfect{display:inline-flex; align-items:center; gap:6px; margin:10px 0 0; padding:5px 12px 3px 9px; border-radius:16px; background:#FFD95A; color:#4A3B52; box-shadow:0 0 0 2.5px #4A3B52; font-weight:900; font-size:.875rem}
.result .perfect svg{width:16px; height:16px; margin-top:-3px}
.result p{margin:10px auto 0; max-width:34ch; color:var(--ink-2); text-wrap:balance}
.actions{display:flex; gap:10px; margin-top:18px}
.btn{flex:1; height:50px; padding:2px 14px 0; border-radius:25px; border:0; box-shadow:0 0 0 2.5px var(--ink); background:var(--surface); font-weight:900; font-size:1rem}
.btn.primary{flex:1.6; background:var(--ink); color:var(--page)}
.btn:active{transform:scale(.98)}

dialog{color:var(--ink); font-family:var(--font)}
dialog::backdrop{background:rgba(40,28,48,.55)}
.sheet{width:100%; max-width:560px; height:100%; max-height:100vh; max-height:100dvh; margin:0 auto; padding:0; border:0; background:var(--page); overflow:hidden}
.sheet[open]{display:flex; flex-direction:column}
.sheet-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:max(14px,env(safe-area-inset-top)) 14px 12px 16px; border-bottom:2.5px solid var(--ink)}
.sheet-head h2{margin:0; font-weight:900; font-size:1.5rem; line-height:1.15}
.sheet-head p{margin:3px 0 0; color:var(--ink-2); font-size:.875rem}
.round{width:40px; height:40px; border-radius:50%; border:0; background:var(--surface); box-shadow:0 0 0 2.5px var(--ink); display:grid; place-items:center; flex:none}
.round svg{width:19px; height:19px}
.sheet-body{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:6px 14px max(24px,env(safe-area-inset-bottom))}
.tier h3{display:flex; align-items:baseline; gap:8px; margin:18px 2px 10px; font-weight:900; font-size:1.0625rem}
.tier h3 i{width:13px; height:13px; border-radius:50%; background:var(--tier); box-shadow:0 0 0 2px var(--ink); align-self:center; margin-top:-3px}
.tier h3 small{font-weight:400; font-size:.8125rem; color:var(--ink-2)}
.tier h3 em{margin-left:auto; font-style:normal; font-weight:600; font-size:.8125rem; color:var(--ink-2)}
.cells{display:grid; grid-template-columns:repeat(8,1fr); gap:8px}
.lv{position:relative; aspect-ratio:1; padding:2px 0 0; border-radius:50%; border:0; box-shadow:0 0 0 2px var(--line); background:var(--surface); font-weight:900; font-size:.875rem; font-variant-numeric:tabular-nums; display:grid; place-items:center}
.lv.done{background:var(--tier); color:var(--tier-ink); box-shadow:0 0 0 2px var(--ink)}
.lv.perfect::after{content:"★"; position:absolute; top:-6px; right:-5px; width:17px; height:17px; border-radius:50%; display:grid; place-items:center; background:var(--page); color:var(--ink); font-size:11px; line-height:1}
.lv.current{box-shadow:0 0 0 2px var(--page), 0 0 0 5px var(--ink)}
.rules{margin:24px 2px 0; padding:16px 0 0; border-top:2.5px solid var(--line); color:var(--ink-2); font-size:.9375rem}
.rules h3{margin:0 0 6px; color:var(--ink); font-weight:900; font-size:1.0625rem}
.rules ul{margin:0; padding-left:1.1em} .rules li{margin:4px 0; max-width:60ch}

@media (prefers-reduced-motion: reduce){
  .blink,.ball .bi,.rm,.spark,.ring2,.arrowG,.tube.nope{animation:none !important}
  .tube.done .cork,.result{transition-duration:.01s !important}
}

.lft{display:flex; align-items:center; gap:7px; justify-self:start}
a.round{color:inherit; text-decoration:none}
</style>
</head>
<body>
<main class="app" id="app">
  <header class="bar">
    <div class="lft"><a class="round" href="index.html" aria-label="Tutti i giochi" data-en-aria="All games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg></a><button class="pill" id="btnLevels" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg>
      <span data-en="Levels">Livelli</span>
    </button></div>
    <div class="where"><div class="badge" id="badge">1</div><div class="wtxt"><strong id="tierName"></strong><span id="lvOf"></span></div></div>
    <span></span>
  </header>
  <div class="stats"><span><span data-en="Moves">Mosse</span><b id="statMoves">0</b></span><span><span data-en="Best possible">Minimo</span><b id="statMin">0</b></span><span><span data-en="Record">Record</span><b id="statBest">–</b></span></div>
  <div class="stage"><svg class="scene" id="scene" aria-label="Barattoli con le palline" data-en-aria="Jars with balls" preserveAspectRatio="xMidYMid meet"></svg></div>
  <p class="status" id="status" aria-live="polite"></p>
  <nav class="controls" id="controls" aria-label="Comandi" data-en-aria="Controls">
    <button class="sign" id="btnUndo" type="button"><span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5L3 10l5 5"/><path d="M3 10h11a5.5 5.5 0 010 11h-3"/></svg></span><span data-en="Undo">Annulla</span></button>
    <button class="sign" id="btnReset" type="button"><span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 11-2.6-5.9"/><path d="M20 3.5V9h-5.5"/></svg></span><span data-en="Restart">Ricomincia</span></button>
    <button class="sign" id="btnHint" type="button"><svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle class="bg" cx="32" cy="32" r="30"/><circle class="fill" id="ringFill" cx="32" cy="32" r="30" stroke-dasharray="188.5" stroke-dashoffset="188.5"/></svg><span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 18.5h5M10.5 21.5h3"/><path d="M12 2.8a6 6 0 00-3.7 10.7c.7.6 1.1 1.4 1.1 2.3h5.2c0-.9.4-1.7 1.1-2.3A6 6 0 0012 2.8z"/></svg></span><span data-en="Help">Aiuto</span></button>
  </nav>
</main>

<section class="result" id="result" hidden aria-live="polite">
  <h2 id="resTitle" data-en="All sorted!">Tutto in ordine!</h2>
  <div class="perfect" id="resPerfect" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/></svg><span data-en="Fewest moves">Minimo di mosse</span></div>
  <p id="resText"></p>
  <div class="actions"><button class="btn" id="btnAgain" type="button" data-en="Play again">Rigioca</button><button class="btn primary" id="btnNext" type="button" data-en="Next level">Livello successivo</button></div>
</section>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-head">
    <div><h2 id="sheetTitle" data-en="Levels">Livelli</h2><p id="sheetSummary"></p></div>
    <button class="round" id="btnCloseSheet" type="button" aria-label="Chiudi" data-en-aria="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</dialog>

<script id="opzioni">
/* Settings shared by the home screen and all six games, kept in localStorage under one key.
   Games read them at every use, so a change on the home screen reaches a game as soon as it is opened. */
window.OPZ = (function () {
  'use strict';
  var KEY = 'giocapensa.opzioni';
  var DEF = { musica: true, suoni: true, voce: true, ui: 'auto', lingua: 'app', aiuto: 'attesa' };
  var CODES = ['it', 'en', 'es', 'pt', 'fr', 'de', 'ja', 'zh-Hant', 'zh-Hans'];        // the same list as LINGUE in lingua.js
  var val = {}, k;
  for (k in DEF) val[k] = DEF[k];
  try {
    var raw = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (raw && typeof raw === 'object') {
      ['musica', 'suoni', 'voce'].forEach(function (n) { if (typeof raw[n] === 'boolean') val[n] = raw[n]; });
      if (['app'].concat(CODES).indexOf(raw.lingua) >= 0) val.lingua = raw.lingua;
      if (['auto'].concat(CODES).indexOf(raw.ui) >= 0) val.ui = raw.ui;
      if (['subito', 'attesa', 'mai'].indexOf(raw.aiuto) >= 0) val.aiuto = raw.aiuto;
    } else if (localStorage.getItem('giocapensa.musica') === '0') val.musica = false;      // the old music-only switch
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(val)); } catch (e) {} }
  return {
    get: function (n) { return n === 'lingua' && val.lingua === 'app' ? (window.LANG || 'it') : val[n]; },   // «app»: the voice speaks the interface language
    raw: function (n) { return val[n]; },
    set: function (n, v) { if (!(n in DEF)) return; val[n] = v; save(); try { window.dispatchEvent(new CustomEvent('opz', { detail: { nome: n, valore: v } })); } catch (e) {} },
    all: function () { var o = {}, q; for (q in val) o[q] = val[q]; return o; }
  };
})();

</script>
<script id="lingua">
/* Interface language. «auto» follows the phone; the setting lives in OPZ ('ui': auto | one of LINGUE).
   Nine languages: Italian (the source), English, Spanish, Portuguese, French, German, Japanese, Chinese (traditional and simplified).
   In the code every visible text is written as L('italiano', 'English'), with placeholders {n} filled from a third argument:
   L('livello {n} di {tot}', 'level {n} of {tot}', { n: 3, tot: 120 }). The other languages come from window.TESTI[lang][italian text],
   which src/build.py puts in each page from src/lingue/<lang>.json (only the texts that page uses). In the markup an element with
   data-en="…" gets the text of the current language; data-en-aria / data-en-title do the same for aria-label and title. */
(function () {
  'use strict';
  var LINGUE = ['it', 'en', 'es', 'pt', 'fr', 'de', 'ja', 'zh-Hant', 'zh-Hans'];
  var NOMI = { it: 'Italiano', en: 'English', es: 'Español', pt: 'Português', fr: 'Français', de: 'Deutsch', ja: '日本語', 'zh-Hant': '繁體中文', 'zh-Hans': '简体中文' };
  var LOCALI = { it: 'it-IT', en: 'en-GB', es: 'es-ES', pt: 'pt-BR', fr: 'fr-FR', de: 'de-DE', ja: 'ja-JP', 'zh-Hant': 'zh-TW', 'zh-Hans': 'zh-CN' };
  function fromTag(t) {                                     // 'pt-BR' → 'pt', 'zh-TW' → 'zh-Hant', 'nl' → null
    t = String(t || '').toLowerCase();
    if (/^zh/.test(t)) return /^zh[-_](hant|tw|hk|mo)/.test(t) ? 'zh-Hant' : 'zh-Hans';
    var b = t.split(/[-_]/)[0];
    return LINGUE.indexOf(b) >= 0 ? b : null;
  }
  function phone() {                                        // the first language of the phone that the app speaks, otherwise English
    var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
    for (var i = 0; i < langs.length; i++) { var l = fromTag(langs[i]); if (l) return l; }
    return 'en';

    var g = fxG.lastElementChild; setTimeout(function () { if (g.parentNode) g.parentNode.removeChild(g); }, 800);
  }
  function confetti() {
    if (calm) return; var h = '', cols = ['#EE5E4D', '#FFD95A', '#7DB7F7', '#8DD68A', '#4FC3C7', '#F59A3A'], i;
    for (i = 0; i < 56; i++) { var w = 10 + Math.random() * 11; h += '<rect class="conf" x="' + (Math.random() * W).toFixed(0) + '" y="-50" width="' + w.toFixed(0) + '" height="' + (w * 1.5).toFixed(0) + '" rx="3" fill="' + cols[i % 6] + '" style="--x:' + ((Math.random() - 0.5) * W * 0.4).toFixed(0) + 'px;--y:' + (H + 160) + 'px;--r:' + ((Math.random() * 900 - 450) | 0) + 'deg;--t:' + (1.9 + Math.random() * 1.7).toFixed(2) + 's;--dl:' + (Math.random() * 0.8).toFixed(2) + 's"/>'; }
    fxG.insertAdjacentHTML('beforeend', '<g>' + h + '</g>');
  }
  function nope(i) { tubeEls(i).forEach(function (el) { el.classList.remove('nope'); void el.getBoundingClientRect(); el.classList.add('nope'); }); sfx('nope'); buzz(14); }
  function updateStats() {
    $('statMoves').textContent = history.length; $('statMin').textContent = minMoves; $('statBest').textContent = data.best[level + 1] || '–';
    $('btnUndo').disabled = won || busy || history.length === 0; $('btnReset').disabled = !won && history.length === 0; gateTick();
  }

  /* ---------- moving a ball ---------- */
  function topEl(i) { return els[i][els[i].length - 1]; }
  function lift(i) {
    var el = topEl(i); lifted = i; ballsG.appendChild(el); el.classList.add('lifted'); refreshDone(true);
    var y0 = el._y; tween(150, function (q) { setPos(el, cx(i), y0 + (liftY() - y0) * outBack(q)); });
    sfx('lift', tubes[i][tubes[i].length - 1]); buzz(6);
  }
  function lower() {
    var i = lifted, el = topEl(i), y0 = el._y, x0 = el._x, y1 = slotY(tubes[i].length - 1); lifted = -1; el.classList.remove('lifted');
    tween(170, function (q) { setPos(el, x0 + (cx(i) - x0) * q, y0 + (y1 - y0) * inQuad(q)); }, function () { land(el); refreshDone(true); });
  }
  function hover() { var el = topEl(lifted), x0 = el._x, y0 = el._y, i = lifted; tween(160, function (q) { setPos(el, x0 + (cx(i) - x0) * smooth(q), y0 + (liftY() - y0) * smooth(q)); }); }
  function transfer(from, to, isUndo) {
    busy = true; lifted = -1;
    var el = els[from].pop(), c = tubes[from].pop(); tubes[to].push(c); els[to].push(el);
    if (!isUndo) history.push({ from: from, to: to });
    el.classList.remove('lifted'); ballsG.appendChild(el);
    var x0 = el._x, y0 = el._y, x1 = cx(to), yl = liftY(), y1 = slotY(tubes[to].length - 1), rise = Math.abs(y0 - yl) > 4 && Math.abs(x0 - x1) > 4 && y0 > yl;
    updateStats();
    function fly() {
      var xa = el._x, ya = el._y, span = Math.abs(x1 - xa);
      tween(120 + span * 0.28, function (q) { var e = smooth(q); setPos(el, xa + (x1 - xa) * e, ya + (yl - ya) * e - Math.sin(Math.PI * q) * Math.min(46, span * 0.2)); }, function () {
        tween(150 + (y1 - yl) * 0.22, function (q) { setPos(el, x1, yl + (y1 - yl) * inQuad(q)); }, function () {
          land(el); sfx('drop', c); buzz(10); busy = false; refreshDone(isUndo); updateStats();
          if (!isUndo && TB.solved(tubes, K)) win();
        });
      });
    }
    if (rise) tween(120, function (q) { setPos(el, x0, y0 + (yl - y0) * smooth(q)); }, fly); else fly();
  }

  function geom() { var b = scene.getBoundingClientRect(), s = Math.min(b.width / W, b.height / H); return { s: s, ox: b.left + (b.width - W * s) / 2, oy: b.top + (b.height - H * s) / 2 }; }
  function toScene(x, y) { var g = geom(); return { x: (x - g.ox) / g.s, y: (y - g.oy) / g.s }; }
  function tubeAt(x, y) {
    var p = toScene(x, y); if (p.x < M - 46 || p.x > W - M + 46) return -1;
    return Math.max(0, Math.min(T - 1, Math.floor((p.x - M) / SP)));
  }
  scene.addEventListener('pointerdown', function (ev) {
    if (busy || won || press || (ev.pointerType === 'mouse' && ev.button !== 0)) return;
    var i = tubeAt(ev.clientX, ev.clientY); if (i < 0) { if (lifted >= 0) lower(); return; }      // a touch outside the jars puts the ball back
    ev.preventDefault(); clearHint();
    if (lifted < 0) { if (!tubes[i].length) return; lift(i); press = { i: i, x: ev.clientX, y: ev.clientY, fresh: true, pid: ev.pointerId }; }
    else press = { i: i, x: ev.clientX, y: ev.clientY, fresh: false, pid: ev.pointerId };
    try { scene.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  scene.addEventListener('pointermove', function (ev) {
    if (!press || ev.pointerId !== press.pid || lifted < 0) return;
    var far = Math.sqrt(Math.pow(ev.clientX - press.x, 2) + Math.pow(ev.clientY - press.y, 2));
    if (far > 44) press.far = true;                                       // a real drag, not a finger that wobbles while tapping
    if (!dragging && press.i === lifted && far > 16) dragging = true;
    if (dragging) { var p = toScene(ev.clientX, ev.clientY); setPos(topEl(lifted), Math.max(R, Math.min(W - R, p.x)), Math.max(30, Math.min(BY - R, p.y - 74))); } // the ball rides above the finger
  });
  function onUp(ev) {
    if (!press || ev.pointerId !== press.pid) return;
    var pr = press; press = null;
    if (busy || lifted < 0) { dragging = false; return; }
    if (dragging) {
      dragging = false; var to = tubeAt(ev.clientX, ev.clientY);
      if (to >= 0 && to !== lifted && tubes[to].length < K) transfer(lifted, to);
      else if (to >= 0 && to !== lifted) { nope(to); hover(); }            // a full jar says no: the ball waits in the air
      else if (pr.fresh && !pr.far && to === lifted) hover();              // it was only a wobbly first tap: the ball stays up, waiting
      else lower();                                                        // dropped on its own jar, or nowhere: back where it came from
      return;
    }
    if (pr.fresh) return;                                   // first tap: the ball stays up, waiting for a destination
    if (pr.i === lifted) lower(); else if (tubes[pr.i].length < K) transfer(lifted, pr.i); else nope(pr.i);
  }
  scene.addEventListener('pointerup', onUp); scene.addEventListener('pointercancel', onUp);
  scene.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  function settle() { if (lifted >= 0) { var el = topEl(lifted); el.classList.remove('lifted'); setPos(el, cx(lifted), slotY(tubes[lifted].length - 1)); lifted = -1; refreshDone(true); } }
  function undo() { if (busy || won || !history.length) return; clearHint(); settle(); var m = history.pop(); transfer(m.to, m.from, true); setStatus(''); }
  function restart() { if (busy) return; loadLevel(level); }

  /* ---------- hint, earned by time or by moves (same rule as Via libera) ---------- */
  var HINT_FIRST = { s: 40, moves: 8 }, HINT_AGAIN = { s: 30, moves: 6 }, gate = { acc: 0, t0: 0, base: 0, need: HINT_FIRST, timer: 0 };
  function gateSeconds() { return gate.acc + (gate.t0 ? (now() - gate.t0) / 1000 : 0); }
  function gateReset(need) { gate.acc = 0; gate.t0 = document.hidden ? 0 : now(); gate.base = history.length; gate.need = need; clearInterval(gate.timer); gate.timer = setInterval(gateTick, 250); gateTick(); }
  function hintMode() { return window.OPZ ? OPZ.get('aiuto') : 'attesa'; }
  function gateProgress() { if (hintMode() === 'subito') return 1; if (hintMode() === 'mai') return 0; return Math.max(Math.min(1, gateSeconds() / gate.need.s), Math.min(1, Math.max(0, history.length - gate.base) / gate.need.moves)); }
  function gateTick() {
    var p = gateProgress(), btn = $('btnHint'), show = !won && hintMode() === 'attesa' && p < 1;
    btn.hidden = hintMode() === 'mai'; btn.disabled = won || p < 1; btn.classList.toggle('waiting', show);
    if (show) $('ringFill').setAttribute('stroke-dashoffset', (188.5 * (1 - p)).toFixed(1)); else { clearInterval(gate.timer); gate.timer = 0; }
  }
  document.addEventListener('visibilitychange', function () { if (document.hidden) { gate.acc = gateSeconds(); gate.t0 = 0; } else if (!gate.t0) gate.t0 = now(); });
  function clearHint() { if (hintG) hintG.innerHTML = ''; }
  function hint() {
    if (won || busy || gateProgress() < 1) return;
    clearHint(); settle();
    var sol = TB.solve(tubes, K, 1, 15000) || TB.solve(tubes, K, 2, 60000) || TB.solve(tubes, K, 4, 200000);
    if (!sol || !sol.length) return;
    gateReset(HINT_AGAIN);
    var m = sol[0], xa = cx(m.from), xb = cx(m.to), ya = slotY(tubes[m.from].length - 1), yb = slotY(tubes[m.to].length), top = liftY() - 6, mid = (xa + xb) / 2, dir = xb > xa ? 1 : -1;
    hintG.innerHTML = '<circle class="ring2" cx="' + xa + '" cy="' + ya + '" r="' + (R + 11) + '"/><circle class="ring2" cx="' + xb + '" cy="' + yb + '" r="' + (R + 11) + '"/>' +
      '<g class="arrowG"><path d="M' + xa + ' ' + top + 'Q' + mid + ' ' + (top - 96) + ' ' + xb + ' ' + top + '" fill="none" stroke="#FF8A3D" stroke-width="10" stroke-linecap="round"/>' +
      '<path d="M' + (xb - dir * 30) + ' ' + (top - 30) + 'L' + xb + ' ' + top + 'L' + (xb - dir * 34) + ' ' + (top + 8) + '" fill="none" stroke="#FF8A3D" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>';
    var c = tubes[m.from][tubes[m.from].length - 1];
    setStatus(FRASI(L('Sposta la pallina {c} dal {a} al {b} barattolo.', 'Move the {c} ball from the {a} to the {b} jar.', { c: NAME[c], a: ORD[m.from], b: ORD_TO[m.to] }),
      sol.length > 1 ? L('Da qui mancano {n} mosse.', '{n} moves to go from here.', { n: sol.length }) : ''));
  }

  /* ---------- winning ---------- */
  function win() {
    won = true; clearInterval(gate.timer); gate.timer = 0; clearHint();
    var moves = history.length, prev = data.best[level + 1];
    if (!prev || moves < prev) data.best[level + 1] = moves;
    data.last = Math.min(RAW.length - 1, level + 1); persist(); updateStats();
    els.forEach(function (col, ti) { col.forEach(function (el, j) { el.style.setProperty('--pd', (ti * 0.09 + j * 0.05).toFixed(2) + 's'); el.classList.remove('land'); el.classList.add('party'); }); if (col.length) setTimeout(function () { sparkle(cx(ti), TOP - 50); }, 120 * ti); });
    var perfect = moves <= minMoves, text;
    sfx(perfect ? 'perfect' : 'win'); buzz(perfect ? [12, 60, 18, 60, 22] : [12, 60, 18]); confetti();
    var v = { n: moves, w: moves === 1 ? L('mossa', 'move') : L('mosse', 'moves'), min: minMoves, rec: prev };
    if (perfect) text = L('Risolto in {n} {w}: meno di così non si può.', 'Solved in {n} {w}: it cannot be done in fewer.', v);
    else if (!prev) text = L('Risolto in {n} {w}. Il minimo è {min}.', 'Solved in {n} {w}. The best possible is {min}.', v);
    else if (moves < prev) text = L('Risolto in {n} {w}, nuovo record. Il minimo è {min}.', 'Solved in {n} {w}, a new record. The best possible is {min}.', v);
    else text = L('Risolto in {n} {w}. Il tuo record è {rec}, il minimo è {min}.', 'Solved in {n} {w}. Your record is {rec}, the best possible is {min}.', v);
    var last = level >= RAW.length - 1;
    $('resPerfect').hidden = !perfect; $('resText').textContent = FRASI(text, last ? L("Era l'ultimo livello.", 'That was the last level.') : '');
    $('btnNext').textContent = last ? L('Scegli un livello', 'Choose a level') : L('Livello successivo', 'Next level');
    statusDefault = false; statusEl.textContent = '';
    setTimeout(function () { if (won) { result.hidden = false; void result.offsetWidth; result.classList.add('show'); controls.style.visibility = 'hidden'; } }, calm ? 200 : 1250);
  }
  function hideResult() { result.classList.remove('show'); result.hidden = true; controls.style.visibility = ''; }

  /* ---------- level sheet ---------- */
  function openDlg(d) { if (d.showModal) { if (!d.open) d.showModal(); } else d.setAttribute('open', ''); }
  function closeDlg(d) { if (d.close) { if (d.open) d.close(); } else d.removeAttribute('open'); }
  function buildSheet() {
    var html = '';
    TIERS.forEach(function (t, ti) {
      var from = ti * PER_TIER, to = Math.min(RAW.length, from + PER_TIER); if (from >= RAW.length) return;
      html += '<section class="tier" style="--tier:' + t.color + ';--tier-ink:' + INK + '"><h3><i></i>' + t.name + '<small>' + (from + 1) + '–' + to + '</small><em data-count="' + ti + '"></em></h3><div class="cells">';
      for (var i = from; i < to; i++) html += '<button class="lv" type="button" data-level="' + i + '">' + (i + 1) + '</button>';
      html += '</div></section>';
    });
    html += '<section class="rules"><h3>' + L('Come si gioca', 'How to play') + '</h3><ul>' + [L('Ogni barattolo deve finire con palline di un solo colore.', 'Each jar must end up with balls of one colour only.'), L('Si sposta una pallina alla volta, quella in cima: toccala e poi tocca il barattolo di arrivo, oppure trascinala.', 'One ball moves at a time, the top one: tap it and then tap the jar it goes to, or drag it.'), L('Una pallina entra in qualsiasi barattolo che abbia ancora posto.', 'A ball fits in any jar that still has room.'), L('Ogni spostamento conta una mossa.', 'Each move counts as one move.')].map(function (r) { return '<li>' + r + '</li>'; }).join('') + '</ul></section>';
    $('sheetBody').innerHTML = html;
    $('sheetBody').addEventListener('click', function (e) { var b = e.target.closest ? e.target.closest('.lv') : null; if (!b) return; loadLevel(+b.getAttribute('data-level')); closeDlg(sheet); });
  }

      b.classList.toggle('done', !!mine); b.classList.toggle('perfect', !!mine && mine <= min); b.classList.toggle('current', i === level);
      if (mine) { counts[Math.floor(i / PER_TIER)]++; label = mine <= min ? L('Livello {n}, risolto con il minimo di mosse', 'Level {n}, solved in the fewest moves', { n: i + 1 }) : L('Livello {n}, risolto in {m} mosse', 'Level {n}, solved in {m} moves', { n: i + 1, m: mine }); if (mine <= min) perfect++; }

    var n = solvedCount();
    $('sheetSummary').textContent = n === 0 ? L('Scegli da quale livello partire: sono tutti aperti.', 'Pick any level to start: they are all open.') : L('{n} di {tot} risolti, {p} con il minimo di mosse.', '{n} of {tot} solved, {p} in the fewest moves.', { n: n, tot: RAW.length, p: perfect });
  }
  function openSheet() { refreshSheet(); openDlg(sheet); var cur = sheet.querySelector('.lv.current'); if (cur) { try { cur.scrollIntoView({ block: 'center' }); } catch (e) {} } }

  $('btnUndo').addEventListener('click', undo);
  $('btnReset').addEventListener('click', restart);
  $('btnHint').addEventListener('click', hint);
  $('btnLevels').addEventListener('click', openSheet);
  $('btnCloseSheet').addEventListener('click', function () { closeDlg(sheet); });
  $('btnAgain').addEventListener('click', function () { loadLevel(level); });
  $('btnNext').addEventListener('click', function () { if (level >= RAW.length - 1) { hideResult(); openSheet(); } else loadLevel(level + 1); });
  buildSheet(); loadLevel(Math.min(data.last, RAW.length - 1));
})();
</script>
